# Default technique hierarchy: which solving techniques exist, which
# difficulty category they belong to, and their relative weight. Weights are
# spaced out so new techniques can be inserted later without renumbering
# everything. Override by loading a different TOML file via
# `TechniqueHierarchy::from_file`.
#
# The ordering/weights below follow the empirically-tuned progression of
# the Java reference solver these techniques were ported from (see
# ROADMAP.md), mapped onto these category names.

